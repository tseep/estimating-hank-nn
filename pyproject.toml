[build-system]
requires = [
  "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "estimating-hank-nn"
dynamic = ["version"]
description = 'Neural network solution and estimation of macroeconomic models'
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = []
authors = [
  { name = "Hanno Kase"},
  { name = "Leonardo Melosi"},
  { name = "Matthias Rottner"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "numpy>=1.26.4",
  "scipy>=1.12.0",
  "matplotlib>=3.8.3",
  "torch>=2.3.0",
  "tqdm>=4.65.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
notebooks = ["jupytext>=1.19.5", "ipykernel>=7.2.0", "nbclient>=0.11.0"]

[project.urls]
Documentation = "https://tseep.github.io/estimating-hank-nn/"
Issues = "https://github.com/tseep/estimating-hank-nn/issues"
Source = "https://github.com/tseep/estimating-hank-nn"

[tool.hatch.version]
path = "src/estimating_hank_nn/__about__.py"

[tool.hatch.build]
# The examples import their own helper modules from their folders.
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/estimating_hank_nn"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml", "/requirements.txt"]
